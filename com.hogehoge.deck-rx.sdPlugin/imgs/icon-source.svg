<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#1c2444"/>
      <stop offset="65%"  stop-color="#08081a"/>
      <stop offset="100%" stop-color="#000208"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff3344"/>
      <stop offset="50%"  stop-color="#ffee00"/>
      <stop offset="100%" stop-color="#cc66ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="14" fill="url(#bg)"/>

  <!-- Antenna mast (vertical) + base -->
  <rect x="48.5" y="60" width="3" height="24" fill="#cfd6e0" rx="0.5"/>
  <rect x="40"   y="84" width="20" height="3" fill="#cfd6e0" rx="0.5"/>

  <!-- Source dot at top of mast -->
  <circle cx="50" cy="60" r="4.5" fill="url(#rainbow)" filter="url(#glow)"/>

  <!-- Three concentric radio-wave arcs spreading upward, rainbow palette -->
  <g fill="none" stroke-linecap="round" stroke-width="6" filter="url(#glow)">
    <path d="M 32 54 Q 50 26 68 54" stroke="#aaff00"/>
    <path d="M 20 50 Q 50 8  80 50" stroke="#33aaff" opacity="0.8"/>
    <path d="M 10 48 Q 50 -8 90 48" stroke="#cc66ff" opacity="0.55"/>
  </g>
</svg>
