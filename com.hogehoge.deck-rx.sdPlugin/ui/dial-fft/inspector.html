<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, sans-serif; font-size: 13px; color: #ccc; background: transparent; margin: 0; padding: 8px; }
    .row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
    label { min-width: 110px; color: #bbb; }
    input[type="number"], select {
      background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 4px;
      padding: 4px 6px; font-size: 13px; width: 100px;
    }
    .hint { color: #888; font-size: 11px; }
  </style>
</head>
<body>
  <div class="row"><label>FFT frame rate</label>
    <input type="number" id="frameRate" min="1" max="120" step="1" value="16" />
    <span class="hint">fps (1-120)</span>
  </div>
  <div class="row"><label>FFT smoothing</label>
    <input type="number" id="smoothing" min="1" max="64" step="1" value="16" />
    <span class="hint">1 = none, larger = smoother</span>
  </div>
  <div class="row"><label>FFT size</label>
    <select id="fftSize">
      <option value="256">256</option>
      <option value="512" selected>512</option>
      <option value="1024">1024</option>
      <option value="2048">2048</option>
    </select>
    <span class="hint">bins</span>
  </div>
  <div class="row"><label>dB floor</label>
    <input type="number" id="dbFloor" min="-160" max="-20" step="1" value="-160" />
    <span class="hint">bottom of scale</span>
  </div>
  <div class="row"><label>dB ceiling</label>
    <input type="number" id="dbCeil" min="-60" max="0" step="1" value="-1" />
    <span class="hint">top of scale</span>
  </div>

  <script>
    let ws = null;
    let actionInfo = null;
    let uuid = null;
    let registerEvent = null;

    // Stream Deck SDK calls this with FIVE positional args:
    // (inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo).
    // The PREVIOUS signature accepted only four, so the variable named
    // inActionInfo actually received inInfo (application info — no
    // payload.settings). That meant the hydrate path silently fell back
    // to the HTML default `value="16"` etc. every time the PI opened,
    // even though save() was sending setSettings correctly. The bug
    // showed up as "values reset on Stream Deck App restart" because
    // there was no observable difference between persisted vs default
    // until the user actually changed a value and then re-opened.
    function connect(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
      uuid = inUUID;
      registerEvent = inRegisterEvent;
      actionInfo = JSON.parse(inActionInfo);
      ws = new WebSocket('ws://127.0.0.1:' + inPort);
      ws.onopen = () => {
        ws.send(JSON.stringify({ event: registerEvent, uuid }));
        // Request the latest persisted settings from Stream Deck App —
        // actionInfo.payload.settings is a snapshot at PI-open time but
        // an explicit getSettings + didReceiveSettings handshake is the
        // SDK-recommended way to handle hydration robustly. The reply
        // comes back through ws.onmessage below.
        ws.send(JSON.stringify({ event: 'getSettings', context: uuid }));
        hydrate(actionInfo.payload.settings || {});
      };
      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.event === 'didReceiveSettings') hydrate(msg.payload.settings || {});
      };
    }
    function hydrate(s) {
      if (s.frameRate)  document.getElementById('frameRate').value  = s.frameRate;
      if (s.smoothing)  document.getElementById('smoothing').value  = s.smoothing;
      if (s.fftSize)    document.getElementById('fftSize').value    = String(s.fftSize);
      if (s.dbFloor != null) document.getElementById('dbFloor').value = s.dbFloor;
      if (s.dbCeil  != null) document.getElementById('dbCeil').value  = s.dbCeil;
    }

    function save() {
      if (!ws) return;
      const settings = {
        frameRate: clamp(parseInt(document.getElementById('frameRate').value, 10), 1, 120, 16),
        smoothing: clamp(parseInt(document.getElementById('smoothing').value, 10), 1, 64, 16),
        fftSize:   parseInt(document.getElementById('fftSize').value, 10) || 512,
        dbFloor:   clamp(parseInt(document.getElementById('dbFloor').value, 10), -160, -20, -160),
        dbCeil:    clamp(parseInt(document.getElementById('dbCeil').value, 10),  -60,  0,  -1),
      };
      ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
    }
    function clamp(v, lo, hi, dflt) {
      if (!Number.isFinite(v)) return dflt;
      return Math.max(lo, Math.min(hi, v));
    }

    // Direct registration — this <script> sits below the input / select
    // elements in body, so the DOM is already populated when the script
    // runs. Wrapping in DOMContentLoaded would silently no-op: Stream
    // Deck App loads the PI HTML completely BEFORE calling
    // connectElgatoStreamDeckSocket, so the event has already fired and
    // a late addEventListener('DOMContentLoaded', ...) never runs. That
    // was the original bug — change listeners never got attached and
    // values typed into the PI were lost on next open.
    ['frameRate','smoothing','fftSize','dbFloor','dbCeil'].forEach((id) => {
      document.getElementById(id).addEventListener('change', save);
    });

    window.connectElgatoStreamDeckSocket = connect;
  </script>
</body>
</html>
