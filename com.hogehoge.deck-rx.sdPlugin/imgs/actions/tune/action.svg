<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#1c2444"/>
      <stop offset="65%"  stop-color="#08081a"/>
      <stop offset="100%" stop-color="#000208"/>
    </radialGradient>
    <radialGradient id="knob" cx="38%" cy="32%" r="70%">
      <stop offset="0%"   stop-color="#b3bfd0"/>
      <stop offset="55%"  stop-color="#3a4150"/>
      <stop offset="100%" stop-color="#10131c"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="14" fill="url(#bg)"/>
  <!-- chrome knob -->
  <circle cx="50" cy="50" r="38" fill="url(#knob)" stroke="#000" stroke-width="1.5"/>
  <!-- inner shadow ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#000" stroke-width="2" opacity="0.45"/>
  <!-- specular highlight -->
  <ellipse cx="40" cy="34" rx="14" ry="7" fill="#ffffff" opacity="0.20"/>
  <!-- prominent notch dot (yellow with glow) -->
  <circle cx="50" cy="22" r="6" fill="#ffee00" stroke="#a89400" stroke-width="1" filter="url(#glow)"/>
</svg>
