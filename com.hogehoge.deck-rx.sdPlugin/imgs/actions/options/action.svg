<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#1c2444"/>
      <stop offset="65%"  stop-color="#08081a"/>
      <stop offset="100%" stop-color="#000208"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="14" fill="url(#bg)"/>

  <!-- gear (8 teeth) at lower-left -->
  <g transform="translate(38,60)">
    <g fill="#cc66ff" filter="url(#glow)">
      <rect x="-3.5" y="-26" width="7" height="9" rx="1.5"/>
      <rect x="-3.5" y="17"  width="7" height="9" rx="1.5"/>
      <rect x="-26"  y="-3.5" width="9" height="7" rx="1.5"/>
      <rect x="17"   y="-3.5" width="9" height="7" rx="1.5"/>
      <rect x="-3.5" y="-26" width="7" height="9" rx="1.5" transform="rotate(45)"/>
      <rect x="-3.5" y="-26" width="7" height="9" rx="1.5" transform="rotate(135)"/>
      <rect x="-3.5" y="-26" width="7" height="9" rx="1.5" transform="rotate(225)"/>
      <rect x="-3.5" y="-26" width="7" height="9" rx="1.5" transform="rotate(315)"/>
    </g>
    <circle r="18" fill="#cc66ff"/>
    <circle r="8" fill="#08081a"/>
  </g>

  <!-- radio waves at upper-right -->
  <g transform="translate(70,32) rotate(-30)" fill="none" stroke="#33ee66" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)">
    <circle cx="0" cy="0" r="2.5" fill="#33ee66" stroke="none"/>
    <path d="M -8 -4 Q 0 -14 8 -4"/>
    <path d="M -14 -2 Q 0 -22 14 -2" opacity="0.65"/>
    <path d="M -20 0  Q 0 -30 20 0" opacity="0.35"/>
  </g>
</svg>
