<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#1c2444"/>
      <stop offset="65%"  stop-color="#08081a"/>
      <stop offset="100%" stop-color="#000208"/>
    </radialGradient>
    <linearGradient id="speaker" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3399ff"/>
      <stop offset="100%" stop-color="#33ccff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="14" fill="url(#bg)"/>
  <!-- speaker body: rectangular pickup + trapezoidal cone -->
  <path d="M 18 40 L 18 60 L 34 60 L 56 78 L 56 22 L 34 40 Z"
        fill="url(#speaker)" stroke="#7fdfff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- sound waves: 3 arcs of decreasing opacity -->
  <path d="M 64 40 Q 72 50 64 60" fill="none" stroke="#aaff00" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 72 32 Q 84 50 72 68" fill="none" stroke="#aaff00" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M 80 24 Q 96 50 80 76" fill="none" stroke="#aaff00" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
</svg>
