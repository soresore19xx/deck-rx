<!--
  === Claude origin ===
  Created/placed by Anthropic Claude Code at: 2026-08-28-213000
  Icon source for the iPadOS bundle. Same dipole as icon-solo.svg — the iPad
  build is the standalone receiver, so it wears the standalone face — but the
  pale-blue plate runs edge to edge instead of sitting on a black square: iOS
  masks the corners itself, and a plate inside a plate reads as a sticker on a
  black tile at the size a home screen actually shows.
  The elements bow rather than run dead straight (2026-08-29): a wire dipole
  sags between its insulators, and the ruler-straight version read as a drawing
  of a line instead of an antenna.
  ====================
-->
