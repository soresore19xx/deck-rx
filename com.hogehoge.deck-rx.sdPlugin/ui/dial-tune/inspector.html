<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, sans-serif; font-size: 13px; color: #ccc; background: transparent; margin: 0; padding: 8px; }
    .row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
    label { min-width: 60px; color: #bbb; }
    select, input[type="text"], input[type="number"], button {
      background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 4px;
      padding: 4px 6px; font-size: 13px;
    }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .err { color: #ff6464; }
    select { flex: 1; }
    input[type="text"] { flex: 1; }
    input[type="number"] { width: 80px; }
    .status { color: #aaa; font-size: 11px; }
  </style>
</head>
<body>
  <div class="row"><label>Mode</label><select id="modeSelect"><option value="preset">Preset scroll</option><option value="vfo">VFO step</option></select></div>
  <div class="row" id="presetRow"><label>Station</label><select id="slotSelect"><option value="">-- Loading... --</option></select></div>
  <div class="row" id="vfoRow" style="display:none"><label>Step</label>
    <select id="stepSelect">
      <option value="1">1 Hz</option><option value="10">10 Hz</option><option value="100">100 Hz</option>
      <option value="1000">1 kHz</option><option value="5000">5 kHz</option>
      <option value="9000">9 kHz (MW Japan)</option><option value="10000">10 kHz (MW Americas)</option>
      <option value="25000">25 kHz</option><option value="50000">50 kHz</option>
      <option value="100000">100 kHz</option><option value="200000">200 kHz</option>
      <option value="500000">500 kHz</option><option value="1000000">1 MHz</option>
    </select>
  </div>
  <div class="row"><label>Border</label><select id="borderSelect"><option value="none">None</option><option value="left">Left</option><option value="right">Right</option><option value="center">Center</option></select></div>
  <hr style="border-color:#444;margin:8px 0"/>
  <div class="row"><label>Audio</label>
    <label style="min-width:auto;display:flex;align-items:center;gap:4px">
      <input type="checkbox" id="audioEnabled"> Enabled
    </label>
  </div>
  <div class="row"><label>Output</label>
    <select id="outputMode">
      <option value="local">Local Device</option>
      <option value="icecast">Icecast Stream</option>
    </select>
  </div>
  <div class="row" id="deviceRow"><label>Device</label>
    <select id="deviceSelect"><option value="-1">-- Loading... --</option></select>
  </div>
  <div class="row" id="icecastUrlRow" style="display:none"><label>URL</label>
    <input type="text" id="icecastUrl" placeholder="icecast://source@host:port/mount" />
  </div>
  <div class="row" id="icecastPwdRow" style="display:none"><label>Password</label>
    <input type="password" id="icecastPassword" placeholder="icecast source-password" />
  </div>
  <div class="row" id="icecastBitrateRow" style="display:none"><label>Bitrate</label>
    <input type="text" id="icecastBitrate" placeholder="128k" style="flex:0 0 80px" />
  </div>
  <hr style="border-color:#444;margin:8px 0"/>
  <div class="row"><label>Server</label>
    <input type="text" id="hostInput" placeholder="192.168.0.142" />
    <input type="number" id="portInput" placeholder="8888" min="1" max="65535" />
  </div>
  <div class="row"><label>EIBI</label>
    <button type="button" id="eibiUpdateBtn">Update Now</button>
    <span class="status" id="eibiStatus"></span>
  </div>
  <div class="row"><label>JP region</label>
    <select id="jpRegionSelect">
      <option value="kanto">関東</option>
      <option value="hokkaido">北海道</option>
      <option value="kinki">近畿</option>
      <option value="chugoku">中国</option>
      <option value="kyushu">九州</option>
      <option value="okinawa">沖縄</option>
    </select>
  </div>
  <div class="row"><label>JP DB</label>
    <button type="button" id="jpUpdateBtn">Update Now</button>
    <span class="status" id="jpStatus"></span>
  </div>
  <div class="row"><span class="status" id="status"></span></div>
</body>
<script>
  var websocket, uuid, actionInfo;
  var MODES = ['NFM','WFM','AM','DSB','USB','CW','LSB','RAW'];
  function fmtFreq(hz) {
    if (hz >= 30000000) return (hz/1000000).toFixed(3)+' MHz';
    if (hz >= 1000000)  return (hz/1000).toFixed(1)+' kHz';
    return (hz/1000).toFixed(2)+' kHz';
  }
  function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
    uuid = inUUID; actionInfo = JSON.parse(inActionInfo);
    websocket = new WebSocket('ws://127.0.0.1:' + inPort);
    websocket.onopen = function() {
      websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
      websocket.send(JSON.stringify({ event: 'getSettings', context: uuid }));
      sendToPlugin({ action: 'getPresets' });
      sendToPlugin({ action: 'getAudioDevices' });
      sendToPlugin({ action: 'getServerConfig' });
      sendToPlugin({ action: 'getEibiStatus' });
      sendToPlugin({ action: 'getJpStationsStatus' });
      sendToPlugin({ action: 'getJpRegion' });
    };
    websocket.onmessage = function(evt) {
      var msg = JSON.parse(evt.data);
      if (msg.event === 'didReceiveSettings') {
        var s = msg.payload.settings;
        document.getElementById('modeSelect').value = s.mode || 'preset';
        document.getElementById('stepSelect').value = String(s.stepHz || 9000);
        document.getElementById('borderSelect').value = s.borderSide || 'none';
        updateModeVisibility(s.mode || 'preset');
        if (s.slotIndex !== undefined) document.getElementById('slotSelect').value = String(s.slotIndex);
      }
      if (msg.event === 'sendToPropertyInspector' && msg.payload.action === 'presets') {
        var s2 = JSON.parse(websocket._lastSettings || '{}');
        buildList(msg.payload.presets, s2.slotIndex || 0);
      }
      if (msg.event === 'sendToPropertyInspector' && msg.payload.action === 'audioDevices') {
        buildDeviceList(msg.payload.devices, msg.payload.current, msg.payload.savedName);
        document.getElementById('audioEnabled').checked = !!msg.payload.audioEnabled;
        var mode = msg.payload.outputMode || 'local';
        document.getElementById('outputMode').value = mode;
        document.getElementById('icecastUrl').value = msg.payload.icecastUrl || '';
        document.getElementById('icecastPassword').value = msg.payload.icecastPassword || '';
        document.getElementById('icecastBitrate').value = msg.payload.bitrate || '128k';
        updateOutputVisibility(mode);
      }
      if (msg.event === 'sendToPropertyInspector' && msg.payload.action === 'serverConfig') {
        document.getElementById('hostInput').value = msg.payload.host || '';
        document.getElementById('portInput').value = msg.payload.port ? String(msg.payload.port) : '';
      }
      if (msg.event === 'sendToPropertyInspector' && msg.payload.action === 'eibiStatus') {
        renderEibiStatus(msg.payload.when, msg.payload.count, null);
      }
      if (msg.event === 'sendToPropertyInspector' && msg.payload.action === 'eibiUpdated') {
        var btn = document.getElementById('eibiUpdateBtn');
        btn.disabled = false;
        btn.textContent = 'Update Now';
        if (msg.payload.ok) {
          renderEibiStatus(msg.payload.when, msg.payload.count, null);
        } else {
          renderEibiStatus(null, null, msg.payload.error || 'unknown error');
        }
      }
      if (msg.event === 'sendToPropertyInspector' && msg.payload.action === 'jpStationsStatus') {
        renderJpStatus(msg.payload.when, msg.payload.count, null,
                       msg.payload.region, msg.payload.manualCount, msg.payload.totalAuto);
      }
      if (msg.event === 'sendToPropertyInspector' && msg.payload.action === 'jpStationsUpdated') {
        var jbtn = document.getElementById('jpUpdateBtn');
        jbtn.disabled = false;
        jbtn.textContent = 'Update Now';
        if (msg.payload.ok) {
          // After successful update, ask for fresh status (count may include
          // entries from other regions in the merged file).
          sendToPlugin({ action: 'getJpStationsStatus' });
        } else {
          renderJpStatus(null, null, msg.payload.error || 'unknown error',
                         msg.payload.region, null, null);
        }
      }
      if (msg.event === 'sendToPropertyInspector' && msg.payload.action === 'jpRegion') {
        if (msg.payload.region) {
          document.getElementById('jpRegionSelect').value = msg.payload.region;
        }
      }
    };
  }
  function sendToPlugin(payload) {
    websocket.send(JSON.stringify({ event: 'sendToPlugin', action: actionInfo.action, context: uuid, payload: payload }));
  }
  function updateModeVisibility(mode) {
    document.getElementById('presetRow').style.display = mode === 'preset' ? 'flex' : 'none';
    document.getElementById('vfoRow').style.display    = mode === 'vfo'    ? 'flex' : 'none';
  }
  function updateOutputVisibility(mode) {
    document.getElementById('deviceRow').style.display         = mode === 'local'   ? 'flex' : 'none';
    document.getElementById('icecastUrlRow').style.display     = mode === 'icecast' ? 'flex' : 'none';
    document.getElementById('icecastPwdRow').style.display     = mode === 'icecast' ? 'flex' : 'none';
    document.getElementById('icecastBitrateRow').style.display = mode === 'icecast' ? 'flex' : 'none';
  }
  function buildList(presets, selectedIdx) {
    var sel = document.getElementById('slotSelect');
    sel.innerHTML = '';
    presets.forEach(function(p, i) {
      if (!p.freq) return;
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.text = fmtFreq(p.freq)+'  '+(MODES[p.mode]||String(p.mode))+'  '+p.name;
      sel.appendChild(opt);
    });
    sel.value = String(selectedIdx);
    document.getElementById('status').textContent = presets.length+' stations (SDR++)';
  }
  function saveSettings() {
    var payload = {
      mode: document.getElementById('modeSelect').value,
      stepHz: parseInt(document.getElementById('stepSelect').value, 10),
      slotIndex: parseInt(document.getElementById('slotSelect').value || '0', 10),
      borderSide: document.getElementById('borderSelect').value,
    };
    websocket.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: payload }));
  }
  function buildDeviceList(devices, current, savedName) {
    var sel = document.getElementById('deviceSelect');
    sel.innerHTML = '<option value="default">System Default (' + (current || '?') + ')</option>';
    devices.forEach(function(d) {
      var opt = document.createElement('option');
      opt.value = d.name;
      opt.text = d.name;
      sel.appendChild(opt);
    });
    if (savedName) sel.value = savedName;
  }
  function saveAudioConfig() {
    var enabled = document.getElementById('audioEnabled').checked;
    var name = document.getElementById('deviceSelect').value;
    var outputMode = document.getElementById('outputMode').value;
    var icecastUrl = document.getElementById('icecastUrl').value.trim();
    var icecastPassword = document.getElementById('icecastPassword').value;
    var bitrate = document.getElementById('icecastBitrate').value.trim() || '128k';
    sendToPlugin({
      action: 'setAudioConfig',
      audioEnabled: enabled,
      deviceName: name,
      outputMode: outputMode,
      icecastUrl: icecastUrl,
      icecastPassword: icecastPassword,
      bitrate: bitrate,
    });
  }
  // Debounce text-input changes (URL / bitrate) so we don't tear down audio
  // on every keystroke. 800 ms after last edit, save.
  var audioTimer = null;
  function scheduleSaveAudio() {
    if (audioTimer) clearTimeout(audioTimer);
    audioTimer = setTimeout(function() { audioTimer = null; saveAudioConfig(); }, 800);
  }
  document.getElementById('modeSelect').addEventListener('change', function() { updateModeVisibility(this.value); saveSettings(); });
  document.getElementById('slotSelect').addEventListener('change', saveSettings);
  document.getElementById('stepSelect').addEventListener('change', saveSettings);
  document.getElementById('borderSelect').addEventListener('change', saveSettings);
  document.getElementById('audioEnabled').addEventListener('change', saveAudioConfig);
  document.getElementById('deviceSelect').addEventListener('change', saveAudioConfig);
  document.getElementById('outputMode').addEventListener('change', function() { updateOutputVisibility(this.value); saveAudioConfig(); });
  document.getElementById('icecastUrl').addEventListener('input', scheduleSaveAudio);
  document.getElementById('icecastPassword').addEventListener('input', scheduleSaveAudio);
  document.getElementById('icecastBitrate').addEventListener('input', scheduleSaveAudio);

  // Host/Port: debounce while user is typing so we don't tear down + reconnect
  // on every keystroke. Apply 800 ms after the last edit.
  var serverTimer = null;
  function scheduleSaveServer() {
    if (serverTimer) clearTimeout(serverTimer);
    serverTimer = setTimeout(function() {
      serverTimer = null;
      var host = document.getElementById('hostInput').value.trim();
      var port = parseInt(document.getElementById('portInput').value, 10);
      var payload = { action: 'setServerConfig' };
      if (host) payload.host = host;
      if (port >= 1 && port <= 65535) payload.port = port;
      if (payload.host || payload.port) sendToPlugin(payload);
    }, 800);
  }
  document.getElementById('hostInput').addEventListener('input', scheduleSaveServer);
  document.getElementById('portInput').addEventListener('input', scheduleSaveServer);

  function renderEibiStatus(whenIso, count, errMsg) {
    var el = document.getElementById('eibiStatus');
    if (errMsg) {
      el.className = 'status err';
      el.textContent = 'Failed: ' + errMsg;
      return;
    }
    el.className = 'status';
    if (!whenIso) { el.textContent = '(no local copy)'; return; }
    var d = new Date(whenIso);
    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    var dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    el.textContent = 'Last update: ' + dateStr + '  /  ' + count + ' entries';
  }
  document.getElementById('eibiUpdateBtn').addEventListener('click', function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Updating...';
    document.getElementById('eibiStatus').className = 'status';
    document.getElementById('eibiStatus').textContent = '';
    sendToPlugin({ action: 'updateEibi' });
  });

  var JP_REGION_LABELS = {
    kanto: '関東', hokkaido: '北海道', kinki: '近畿',
    chugoku: '中国', kyushu: '九州', okinawa: '沖縄',
  };
  function renderJpStatus(whenIso, count, errMsg, region, manualCount, totalAuto) {
    var el = document.getElementById('jpStatus');
    if (errMsg) {
      el.className = 'status err';
      el.textContent = 'Failed: ' + errMsg;
      return;
    }
    el.className = 'status';
    if (!whenIso) { el.textContent = '(no local copy)'; return; }
    var d = new Date(whenIso);
    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    var dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    var label = (region && JP_REGION_LABELS[region]) ? JP_REGION_LABELS[region] : '';
    var manualPart = (typeof manualCount === 'number' && manualCount > 0) ? ' + ' + manualCount + ' manual' : '';
    var totalPart  = (typeof totalAuto === 'number' && typeof count === 'number' && totalAuto > count)
      ? ' (file total ' + totalAuto + ')' : '';
    el.textContent = 'Last update: ' + dateStr + ' / '
      + (label ? label + ' ' : '') + (count != null ? count : '?') + ' entries'
      + manualPart + totalPart;
  }
  document.getElementById('jpUpdateBtn').addEventListener('click', function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Updating...';
    document.getElementById('jpStatus').className = 'status';
    document.getElementById('jpStatus').textContent = '';
    sendToPlugin({ action: 'updateJpStations' });
  });
  document.getElementById('jpRegionSelect').addEventListener('change', function() {
    sendToPlugin({ action: 'setJpRegion', region: this.value });
  });
</script>
</html>
