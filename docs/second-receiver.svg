<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="672" viewBox="0 0 1280 672" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="672" fill="#ffffff"/>

  <text x="24" y="38" font-size="21" font-weight="bold" fill="#111">Second receiver — how it is wired</text>
  <text x="24" y="60" font-size="13" fill="#666">The loop and the FM antennas are combined, split to an Airspy HF+ and an RTL-SDR V4, and served by two SpyServer instances. Clients choose host:port.</text>

  <!-- ============ column 1: antennas ============ -->
  <text x="40" y="104" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">ANTENNAS</text>

  <rect x="40" y="120" width="170" height="44" rx="5" fill="#eef4fb" stroke="#4a76a8" stroke-width="1.5"/>
  <text x="125" y="139" font-size="13" text-anchor="middle" fill="#1a3a5c">MLA-30+ loop</text>
  <text x="125" y="155" font-size="11" text-anchor="middle" fill="#5a7a9c">active, outdoors · MW / SW</text>

  <line x1="125" y1="164" x2="125" y2="190" stroke="#4a76a8" stroke-width="2"/>
  <rect x="40" y="190" width="170" height="44" rx="5" fill="#eef4fb" stroke="#4a76a8" stroke-width="1.5"/>
  <text x="125" y="209" font-size="12" text-anchor="middle" fill="#1a3a5c">Loop amplifier</text>
  <text x="125" y="225" font-size="11" text-anchor="middle" fill="#5a7a9c">5 V from its own bias tee</text>

  <line x1="125" y1="234" x2="125" y2="260" stroke="#4a76a8" stroke-width="2"/>
  <rect x="40" y="260" width="170" height="44" rx="5" fill="#eef4fb" stroke="#4a76a8" stroke-width="1.5"/>
  <text x="125" y="279" font-size="12" text-anchor="middle" fill="#1a3a5c">Low-pass 40 MHz</text>
  <text x="125" y="295" font-size="11" text-anchor="middle" fill="#5a7a9c">5-pole, home-made</text>

  <rect x="40" y="356" width="170" height="44" rx="5" fill="#eef4fb" stroke="#4a76a8" stroke-width="1.5"/>
  <text x="125" y="375" font-size="12" text-anchor="middle" fill="#1a3a5c">FM antennas</text>
  <text x="125" y="391" font-size="11" text-anchor="middle" fill="#5a7a9c">outdoor · indoor rod · cable</text>

  <line x1="125" y1="400" x2="125" y2="426" stroke="#4a76a8" stroke-width="2"/>
  <rect x="40" y="426" width="170" height="44" rx="5" fill="#eef4fb" stroke="#4a76a8" stroke-width="1.5"/>
  <text x="125" y="445" font-size="12" text-anchor="middle" fill="#1a3a5c">Antenna switch</text>
  <text x="125" y="461" font-size="11" text-anchor="middle" fill="#5a7a9c">4 in, 1 out</text>

  <!-- ============ column 2: combine, split, pad ============ -->
  <text x="270" y="104" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">FEED</text>

  <path d="M 210 282 L 240 282 L 240 318 L 270 318" fill="none" stroke="#4a76a8" stroke-width="2"/>
  <path d="M 210 448 L 240 448 L 240 352 L 270 352" fill="none" stroke="#4a76a8" stroke-width="2"/>

  <rect x="270" y="298" width="160" height="74" rx="5" fill="#f4f0fa" stroke="#7a5ca8" stroke-width="1.5"/>
  <text x="350" y="319" font-size="12" text-anchor="middle" font-weight="bold" fill="#4a3470">2-way, as a combiner</text>
  <text x="350" y="337" font-size="11" text-anchor="middle" fill="#6a5a8a">splitter used backwards</text>
  <text x="350" y="355" font-size="11" text-anchor="middle" fill="#6a5a8a">about −3.5 dB per input</text>

  <line x1="350" y1="372" x2="350" y2="408" stroke="#4a76a8" stroke-width="2"/>
  <rect x="270" y="408" width="160" height="74" rx="5" fill="#f4f0fa" stroke="#7a5ca8" stroke-width="1.5"/>
  <text x="350" y="429" font-size="12" text-anchor="middle" font-weight="bold" fill="#4a3470">2-way splitter</text>
  <text x="350" y="447" font-size="11" text-anchor="middle" fill="#6a5a8a">18 dB isolation on MW</text>
  <text x="350" y="465" font-size="11" text-anchor="middle" fill="#6a5a8a">both receivers, same feed</text>

  <!-- OUT 1 → HF+ -->
  <path d="M 430 426 L 462 426 L 462 238 L 520 238" fill="none" stroke="#2e8b57" stroke-width="2" marker-end="url(#g)"/>
  <!-- OUT 2 → 6 dB pad → V4 -->
  <path d="M 430 464 L 446 464" fill="none" stroke="#d2691e" stroke-width="2"/>
  <rect x="446" y="448" width="50" height="34" rx="4" fill="#fff" stroke="#d2691e" stroke-width="1.5"/>
  <text x="471" y="463" font-size="11" text-anchor="middle" font-weight="bold" fill="#8a4513">6 dB</text>
  <text x="471" y="476" font-size="10" text-anchor="middle" fill="#b5754a">π pad</text>
  <path d="M 496 466 L 520 466" fill="none" stroke="#d2691e" stroke-width="2" marker-end="url(#o)"/>

  <!-- ============ column 3: receivers ============ -->
  <text x="520" y="104" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">RECEIVERS</text>

  <rect x="520" y="210" width="180" height="56" rx="5" fill="#e9f6ee" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="610" y="232" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d5c39">Airspy HF+ Discovery</text>
  <text x="610" y="251" font-size="11" text-anchor="middle" fill="#4a8a68">18 bit · gain 0-8</text>

  <rect x="520" y="438" width="180" height="56" rx="5" fill="#fdf0e6" stroke="#d2691e" stroke-width="1.5"/>
  <text x="610" y="460" font-size="13" text-anchor="middle" font-weight="bold" fill="#8a4513">RTL-SDR Blog V4</text>
  <text x="610" y="479" font-size="11" text-anchor="middle" fill="#b5754a">8 bit · gain 0-28</text>

  <text x="520" y="516" font-size="11" fill="#8a4513">the pad keeps the 8 bit V4 out of overload;</text>
  <text x="520" y="532" font-size="11" fill="#8a4513">the HF+ takes the full level</text>

  <!-- USB -->
  <path d="M 700 238 L 760 238" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 700 466 L 760 466" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="730" y="230" font-size="11" text-anchor="middle" fill="#555">USB</text>
  <text x="730" y="458" font-size="11" text-anchor="middle" fill="#555">USB</text>

  <!-- ============ column 4: server ============ -->
  <text x="760" y="104" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">SERVER</text>

  <rect x="760" y="120" width="240" height="462" rx="8" fill="#f2f2f7" stroke="#9999aa" stroke-width="1.5"/>
  <text x="776" y="143" font-size="13" font-weight="bold" fill="#44445c">SpyServer host</text>
  <text x="776" y="161" font-size="11" fill="#777">a Linux VM, USB passed through</text>

  <rect x="776" y="204" width="208" height="70" rx="5" fill="#e9f6ee" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="790" y="225" font-size="12" font-weight="bold" fill="#1d5c39">spyserver :8888</text>
  <text x="790" y="243" font-size="11" fill="#4a8a68">device_type = AirspyHF+</text>
  <text x="790" y="261" font-size="11" fill="#4a8a68">up to 3 clients</text>

  <rect x="776" y="430" width="208" height="70" rx="5" fill="#fdf0e6" stroke="#d2691e" stroke-width="1.5"/>
  <text x="790" y="451" font-size="12" font-weight="bold" fill="#8a4513">spyserver :8889</text>
  <text x="790" y="469" font-size="11" fill="#b5754a">device_type = RTL-SDR</text>
  <text x="790" y="487" font-size="11" fill="#b5754a">librtlsdr, loaded at run time</text>

  <rect x="776" y="514" width="208" height="54" rx="5" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="790" y="535" font-size="12" font-weight="bold" fill="#888">rtl_tcp :8890 — off</text>
  <text x="790" y="553" font-size="11" fill="#999">the V4's other path, kept in the clients</text>

  <!-- ============ column 5: clients ============ -->
  <text x="1050" y="104" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">CLIENTS</text>

  <path d="M 984 239 L 1024 239" fill="none" stroke="#2e8b57" stroke-width="2"/>
  <path d="M 984 465 L 1024 465" fill="none" stroke="#d2691e" stroke-width="2"/>
  <line x1="1024" y1="158" x2="1024" y2="465" stroke="#888" stroke-width="2"/>
  <path d="M 1024 158 L 1050 158" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 1024 230 L 1050 230" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 1024 302 L 1050 302" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 1024 374 L 1050 374" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1050" y="128" width="200" height="60" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="1150" y="150" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Stream Deck plugin</text>
  <text x="1150" y="169" font-size="11" text-anchor="middle" fill="#777">Stream Deck +</text>

  <rect x="1050" y="200" width="200" height="60" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="1150" y="222" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Deck RX Solo</text>
  <text x="1150" y="241" font-size="11" text-anchor="middle" fill="#777">macOS</text>

  <rect x="1050" y="272" width="200" height="60" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="1150" y="294" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Deck RX for iPad</text>
  <text x="1150" y="313" font-size="11" text-anchor="middle" fill="#777">iPadOS</text>

  <rect x="1050" y="344" width="200" height="60" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="1150" y="366" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">Any SpyServer client</text>
  <text x="1150" y="385" font-size="11" text-anchor="middle" fill="#777">SDR++, unattended recordings</text>

  <rect x="1050" y="428" width="200" height="76" rx="5" fill="#f7f9fc" stroke="#4a76a8" stroke-width="1.5"/>
  <text x="1150" y="449" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a3a5c">one receiver at a time</text>
  <text x="1062" y="469" font-size="10.5" fill="#33566f">Source + host:port picks it;</text>
  <text x="1062" y="487" font-size="10.5" fill="#33566f">gain and IQ width are per receiver</text>

  <!-- footer -->
  <line x1="40" y1="604" x2="1240" y2="604" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="628" font-size="12" font-weight="bold" fill="#555">Combined, then split:</text>
  <text x="200" y="628" font-size="12" fill="#666">the loop and the FM antenna reach both receivers at once, so a shortwave recording and FM listening no longer need the switch turned.</text>
  <text x="40" y="652" font-size="12" font-weight="bold" fill="#555">Low-pass on the loop:</text>
  <text x="200" y="652" font-size="12" fill="#666">the loop amplifier was putting noise into the FM band (the HF+'s FM floor up 4-8 dB); a 40 MHz cut-off removes it with no loss on medium wave.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d2691e"/>
    </marker>
  </defs>
</svg>
