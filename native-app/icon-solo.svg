<!--
  === Claude origin ===
  Created/placed by Anthropic Claude Code at: 2026-08-24-072000
  Icon source for Deck RX Solo, the standalone receiver. Same dipole drawing as
  the plugin's icon-source.svg, on a square pale-blue plate instead of a grey disc:
  the two apps sat side by side in the Dock wearing the same face. Shape and
  colour both differ, so the pair still reads apart at 16 px, where a colour
  change alone can be lost to a dark background.
  Lives here rather than beside the plugin's icon because this bundle is the one
  that does not belong to the plugin.
  ====================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <rect width="144" height="144" fill="#000000"/>
  <defs>
    <linearGradient id="g" x1="0.18" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#dcecfb"/>
      <stop offset="0.55" stop-color="#9cc6ec"/>
      <stop offset="1" stop-color="#5c8fbe"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="120" height="120" rx="20" fill="url(#g)" stroke="#1a1a1a" stroke-width="3"/>

  <line x1="16" y1="60" x2="30" y2="60" stroke="#2f4f6b" stroke-width="2.5" stroke-dasharray="3,2"/>
  <line x1="114" y1="60" x2="128" y2="60" stroke="#2f4f6b" stroke-width="2.5" stroke-dasharray="3,2"/>

  <line x1="36" y1="60" x2="66" y2="60" stroke="#0a0a0a" stroke-width="3.5" stroke-linecap="butt"/>
  <line x1="78" y1="60" x2="108" y2="60" stroke="#0a0a0a" stroke-width="3.5" stroke-linecap="butt"/>

  <ellipse cx="33" cy="60" rx="2.6" ry="4.5" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
  <ellipse cx="111" cy="60" rx="2.6" ry="4.5" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>

  <rect x="66" y="50" width="12" height="22" rx="2.4" fill="#f2f8ff" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="66" y1="61" x2="78" y2="61" stroke="#0a0a0a" stroke-width="0.7" opacity="0.5"/>

  <!-- Coax feeder: thinner upper half, thicker lower half (twin-lead to coax) -->
  <line x1="72" y1="72" x2="72" y2="90" stroke="#0a0a0a" stroke-width="2.5"/>
  <line x1="72" y1="90" x2="72" y2="108" stroke="#0a0a0a" stroke-width="4.5"/>
  <circle cx="72" cy="110" r="2.8" fill="#0a0a0a"/>
</svg>
